<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="monkey_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#080718"/>
    </radialGradient>
    <linearGradient id="monkey_hp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="58" fill="url(#monkey_bg)"/>

  <!-- Big Monkey Ears -->
  <circle cx="32" cy="56" r="16" fill="#8B4513"/>
  <circle cx="32" cy="56" r="10" fill="#E8B282"/>

  <circle cx="88" cy="56" r="16" fill="#8B4513"/>
  <circle cx="88" cy="56" r="10" fill="#E8B282"/>

  <!-- Head -->
  <ellipse cx="60" cy="62" rx="27" ry="24" fill="#8B4513"/>

  <!-- Face Mask (Heart-like curved area) -->
  <ellipse cx="50" cy="55" rx="12" ry="12" fill="#E8B282"/>
  <ellipse cx="70" cy="55" rx="12" ry="12" fill="#E8B282"/>
  <ellipse cx="60" cy="68" rx="19" ry="14" fill="#E8B282"/>

  <!-- Eyes: One wink, one wide open -->
  <circle cx="49" cy="56" r="4" fill="#1C140E"/>
  <circle cx="48" cy="54.5" r="1.5" fill="#FFFFFF"/>
  <!-- Wink right eye -->
  <path d="M66,56 Q71,52 76,56" stroke="#1C140E" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Nose & Fun Smile -->
  <ellipse cx="57.5" cy="67" rx="1.5" ry="2" fill="#1C140E"/>
  <ellipse cx="62.5" cy="67" rx="1.5" ry="2" fill="#1C140E"/>
  <path d="M50,72 Q60,82 70,72" stroke="#1C140E" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Cyber Beats Headphones -->
  <path d="M26,62 C20,20 100,20 94,62" stroke="url(#monkey_hp)" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <rect x="18" y="52" width="13" height="25" rx="6" fill="#EA580C"/>
  <rect x="21" y="55" width="7" height="19" rx="3" fill="#38BDF8"/>
  <circle cx="24.5" cy="64.5" r="2" fill="#FFFFFF"/>

  <rect x="89" y="52" width="13" height="25" rx="6" fill="#EA580C"/>
  <rect x="92" y="55" width="7" height="19" rx="3" fill="#38BDF8"/>
  <circle cx="95.5" cy="64.5" r="2" fill="#FFFFFF"/>

  <!-- Floating DJ sound accents -->
  <circle cx="98" cy="30" r="3" fill="#06B6D4"/>
  <circle cx="103" cy="24" r="2" fill="#F97316"/>
  <path d="M96,40 L102,36 L102,46 M96,48 A2.5,2.5 0 1,1 96,43 A2.5,2.5 0 0,1 96,48" stroke="#06B6D4" stroke-width="1.8" fill="#06B6D4" stroke-linecap="round"/>
</svg>
