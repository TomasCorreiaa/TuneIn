<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="cat_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0A091A"/>
    </radialGradient>
    <linearGradient id="cat_hp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="58" fill="url(#cat_bg)"/>

  <!-- Cat Ears -->
  <polygon points="34,48 26,18 50,36" fill="#374151"/>
  <polygon points="33,44 28,24 45,36" fill="#F472B6"/>

  <polygon points="86,48 94,18 70,36" fill="#374151"/>
  <polygon points="87,44 92,24 75,36" fill="#F472B6"/>

  <!-- Head -->
  <ellipse cx="60" cy="63" rx="27" ry="24" fill="#374151"/>

  <!-- Cat Eyes (Amber/Green with vertical pupil) -->
  <ellipse cx="48" cy="58" rx="6" ry="7" fill="#FACC15"/>
  <ellipse cx="48" cy="58" rx="2" ry="6" fill="#0F172A"/>
  <circle cx="46.5" cy="55.5" r="1.5" fill="#FFFFFF"/>

  <ellipse cx="72" cy="58" rx="6" ry="7" fill="#FACC15"/>
  <ellipse cx="72" cy="58" rx="2" ry="6" fill="#0F172A"/>
  <circle cx="70.5" cy="55.5" r="1.5" fill="#FFFFFF"/>

  <!-- Nose & Mouth -->
  <polygon points="60,68 56.5,65 63.5,65" fill="#F472B6"/>
  <path d="M55,70 Q60,73 65,70" stroke="#E5E7EB" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Whiskers -->
  <line x1="30" y1="67" x2="48" y2="69" stroke="#E5E7EB" stroke-width="1.5" opacity="0.8"/>
  <line x1="28" y1="73" x2="48" y2="72" stroke="#E5E7EB" stroke-width="1.5" opacity="0.8"/>
  <line x1="90" y1="67" x2="72" y2="69" stroke="#E5E7EB" stroke-width="1.5" opacity="0.8"/>
  <line x1="92" y1="73" x2="72" y2="72" stroke="#E5E7EB" stroke-width="1.5" opacity="0.8"/>

  <!-- Cool Bowtie -->
  <polygon points="53,84 60,86 53,88" fill="#F43F5E"/>
  <polygon points="67,84 60,86 67,88" fill="#F43F5E"/>
  <circle cx="60" cy="86" r="2.5" fill="#BE123C"/>

  <!-- Headphones -->
  <path d="M28,62 C22,20 98,20 92,62" stroke="url(#cat_hp)" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <rect x="20" y="52" width="12" height="24" rx="6" fill="#6366F1"/>
  <rect x="22" y="55" width="8" height="18" rx="4" fill="#38BDF8"/>
  <circle cx="26" cy="64" r="2" fill="#FFFFFF"/>

  <rect x="88" y="52" width="12" height="24" rx="6" fill="#6366F1"/>
  <rect x="90" y="55" width="8" height="18" rx="4" fill="#38BDF8"/>
  <circle cx="94" cy="64" r="2" fill="#FFFFFF"/>

  <!-- Treble clef or notes -->
  <path d="M96,28 L103,24 L103,34 M96,37 A3,3 0 1,1 96,31 A3,3 0 0,1 96,37" stroke="#38BDF8" stroke-width="2" fill="#38BDF8" stroke-linecap="round"/>
</svg>
