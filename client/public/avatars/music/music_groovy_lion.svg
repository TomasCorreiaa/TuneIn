<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="lion_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1A0701"/>
    </radialGradient>
    <linearGradient id="lion_hp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="58" fill="url(#lion_bg)"/>

  <!-- Fluffy Mane (Petal-style circles) -->
  <circle cx="40" cy="45" r="13" fill="#B45309"/>
  <circle cx="60" cy="38" r="13" fill="#B45309"/>
  <circle cx="80" cy="45" r="13" fill="#B45309"/>
  <circle cx="34" cy="62" r="13" fill="#B45309"/>
  <circle cx="86" cy="62" r="13" fill="#B45309"/>
  <circle cx="42" cy="78" r="13" fill="#B45309"/>
  <circle cx="60" cy="82" r="13" fill="#B45309"/>
  <circle cx="78" cy="78" r="13" fill="#B45309"/>

  <!-- Lion Ears -->
  <circle cx="36" cy="46" r="8" fill="#F59E0B"/>
  <circle cx="36" cy="46" r="4.5" fill="#FEF3C7"/>
  <circle cx="84" cy="46" r="8" fill="#F59E0B"/>
  <circle cx="84" cy="46" r="4.5" fill="#FEF3C7"/>

  <!-- Lion Face -->
  <circle cx="60" cy="63" r="23" fill="#FBBF24"/>

  <!-- Muzzle -->
