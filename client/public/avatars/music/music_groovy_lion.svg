  <circle cx="48.5" cy="56.5" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="70" cy="58" rx="4" ry="4.5" fill="#1C140E"/>
  <circle cx="68.5" cy="56.5" r="1.5" fill="#FFFFFF"/>

  <!-- Groovy Tri-Color Headphones -->
  <path d="M28,62 C22,22 98,22 92,62" stroke="url(#lion_hp)" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <rect x="20" y="52" width="13" height="24" rx="6" fill="#DC2626"/>
  <rect x="23" y="55" width="7" height="18" rx="3" fill="#F59E0B"/>
  <circle cx="26.5" cy="64" r="2" fill="#10B981"/>

  <rect x="87" y="52" width="13" height="24" rx="6" fill="#DC2626"/>
  <rect x="90" y="55" width="7" height="18" rx="3" fill="#F59E0B"/>
  <circle cx="93.5" cy="64" r="2" fill="#10B981"/>

  <!-- Musical floating note -->
  <path d="M96,28 L104,24 L104,35 M96,38 A3,3 0 1,1 96,32 A3,3 0 0,1 96,38" stroke="#FBBF24" stroke-width="2" fill="#FBBF24" stroke-linecap="round"/>
</svg>
