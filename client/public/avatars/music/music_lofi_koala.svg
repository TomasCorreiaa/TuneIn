<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="koala_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F282F"/>
      <stop offset="100%" stop-color="#040F13"/>
    </radialGradient>
    <linearGradient id="koala_hp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="58" fill="url(#koala_bg)"/>

  <!-- Big Fluffy Koala Ears -->
  <circle cx="34" cy="44" r="16" fill="#94A3B8"/>
  <circle cx="34" cy="44" r="10" fill="#E2E8F0"/>

  <circle cx="86" cy="44" r="16" fill="#94A3B8"/>
  <circle cx="86" cy="44" r="10" fill="#E2E8F0"/>

  <!-- Head -->
  <ellipse cx="60" cy="63" rx="27" ry="24" fill="#94A3B8"/>

  <!-- Big Iconic Oval Koala Nose -->
  <ellipse cx="60" cy="67" rx="8" ry="11" fill="#334155"/>
  <ellipse cx="58.5" cy="63" rx="2" ry="3" fill="#64748B"/>

  <!-- Chill Lo-Fi Closed Eyes (Enjoying music) -->
  <path d="M43,58 Q48,63 53,58" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M67,58 Q72,63 77,58" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Subtle Smile -->
  <path d="M56,80 Q60,83 64,80" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Rosy cheeks -->
  <circle cx="41" cy="68" r="4" fill="#F472B6" opacity="0.4"/>
  <circle cx="79" cy="68" r="4" fill="#F472B6" opacity="0.4"/>

  <!-- Lo-Fi Mint Headphones -->
  <path d="M28,62 C22,22 98,22 92,62" stroke="url(#koala_hp)" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <rect x="20" y="52" width="12" height="24" rx="6" fill="#059669"/>
  <rect x="22" y="55" width="8" height="18" rx="4" fill="#34D399"/>
  <circle cx="26" cy="64" r="2" fill="#FFFFFF"/>

  <rect x="88" y="52" width="12" height="24" rx="6" fill="#059669"/>
  <rect x="90" y="55" width="8" height="18" rx="4" fill="#34D399"/>
  <circle cx="94" cy="64" r="2" fill="#FFFFFF"/>

  <!-- Lo-Fi Chill Musical Notes / Zzz / Beats -->
  <path d="M96,28 L104,24 L104,35 M96,38 A3,3 0 1,1 96,32 A3,3 0 0,1 96,38" stroke="#34D399" stroke-width="2" fill="#34D399" stroke-linecap="round"/>
</svg>
